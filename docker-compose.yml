version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_USER: ather
      POSTGRES_PASSWORD: jam18EE-t
      POSTGRES_DB: video_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    restart: unless-stopped

  service-discovery:
    build:
      context: .
      dockerfile: service-discovery/Dockerfile

    container_name: service-discovery

    ports:
      - "8761:8761"

    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile

    container_name: api-gateway

    ports:
      - "8080:8080"

    depends_on:
      - service-discovery

    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile

    container_name: auth-service

    ports:
      - "8081:8081"

    depends_on:
      - postgres
      - service-discovery

    restart: unless-stopped

  video-service:
    build:
      context: .
      dockerfile: video-service/Dockerfile

    container_name: video-service

    ports:
      - "8083:8083"

    depends_on:
      - postgres
      - service-discovery

    restart: unless-stopped

  upload-service:
    build:
      context: .
      dockerfile: upload-service/Dockerfile

    container_name: upload-service

    ports:
      - "8084:8084"

    depends_on:
      - postgres
      - minio
      - service-discovery

    restart: unless-stopped

volumes:
  postgres-data:
  minio-data: