apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: video-streaming
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: video-streaming/api-gateway:1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: EUREKA_SERVER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: eureka.server
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: video-streaming
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: api-gateway

